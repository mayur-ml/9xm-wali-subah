<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9XM Wali Subah</title>
<meta name="description" content="9XM Wali Subah -- press play for a straight shot of 90s & 2000s Bollywood.">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-03L3ZT2NXB"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());
  gtag('config', 'G-03L3ZT2NXB');
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #eeddc0;
    --black: #180705;
    --line: rgba(238,221,192,0.35);
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4a0705;
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
  }
  .hero{
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background-color: #4a0705;
    overflow: hidden;
  }
  /* two stacked background layers so switching images on a track change is
     a real crossfade (new one fades in while the old one fades out) instead
     of an instant, jarring swap. only one carries .is-visible at a time --
     see pickRandomBackground() in the script below. */
  .hero-bg{
    position: absolute;
    inset: 0;
    background-size: cover;
    background-position: 35% center;
    background-repeat: no-repeat;
    opacity: 0;
    transition: opacity 0.9s ease;
    z-index: 0;
  }
  .hero-bg.is-visible{ opacity: 1; }
  /* dock holds the queue panel + seek bar + player pill together, bottom-centered */
  .player-dock{
    position: absolute;
    left: 50%;
    bottom: calc(clamp(21px, 5vh, 46px) + env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    z-index: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 9px;
    width: min(499px, 90vw);
  }
  /* seek bar row */
  .seek-wrap{
    display: flex;
    align-items: center;
    gap: 9px;
    width: 100%;
    padding: 7px 17px;
    background: rgba(24, 7, 5, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 10px 31px rgba(0,0,0,0.35);
  }
  .seek-wrap .time{
    font-size: 10px;
    letter-spacing: 0.03em;
    color: var(--cream);
    opacity: 0.75;
    flex: 0 0 auto;
    min-width: 33px;
    text-align: center;
  }
  .seek-bar{
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 5px;
    border-radius: 3px;
    background: rgba(238,221,192,0.25);
    outline: none;
    cursor: pointer;
  }
  .seek-bar::-webkit-slider-runnable-track{
    height: 5px;
    border-radius: 3px;
    background: transparent;
  }
  .seek-bar::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 13px;
    height: 13px;
    margin-top: -4px;
    border-radius: 50%;
    background: var(--cream);
    cursor: pointer;
    box-shadow: 0 0 4px rgba(0,0,0,0.4);
  }
  .seek-bar::-moz-range-track{
    height: 5px;
    border-radius: 3px;
    background: transparent;
  }
  .seek-bar::-moz-range-thumb{
    width: 13px;
    height: 13px;
    border: none;
    border-radius: 50%;
    background: var(--cream);
    cursor: pointer;
    box-shadow: 0 0 4px rgba(0,0,0,0.4);
  }
  /* "up next" queue dropdown */
  .queue-panel{
    width: 100%;
    background: rgba(24, 7, 5, 0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 17px;
    padding: 13px 14px;
    box-shadow: 0 10px 31px rgba(0,0,0,0.35);
    max-height: min(226px, 42vh);
    overflow-y: auto;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  .queue-panel[hidden]{ display: none; }
  .queue-title{
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cream);
    opacity: 0.6;
    margin: 0 0 9px 4px;
  }
  .queue-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .queue-list li{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--cream);
    font-size: 13px;
    padding: 7px 9px;
    border-radius: 9px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .queue-list li:hover{ background: rgba(238,221,192,0.1); }
  .queue-list li .qnum{
    opacity: 0.5;
    font-size: 10px;
    min-width: 14px;
    flex: 0 0 auto;
  }
  .queue-list li .qtitle{
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .queue-list .qempty{
    opacity: 0.5;
    font-size: 12px;
    padding: 7px 9px;
    cursor: default;
  }
  .queue-list .qempty:hover{ background: transparent; }
  /* small audio-only music player (video track hidden, custom controls) */
  .player{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 9px 17px 9px 9px;
    background: rgba(24, 7, 5, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 10px 31px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .play-btn{
    width: 42px;
    height: 42px;
    flex: 0 0 auto;
    border-radius: 50%;
    border: none;
    background: var(--cream);
    color: var(--black);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  .play-btn:hover{ transform: scale(1.06); }
  .play-btn:active{ transform: scale(0.96); }
  .play-btn svg{ width: 17px; height: 17px; }
  .play-btn .icon-pause{ display: none; }
  .player.is-playing .icon-play{ display: none; }
  .player.is-playing .icon-pause{ display: block; }
  .nav-btn{
    width: 27px;
    height: 27px;
    flex: 0 0 auto;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--cream);
    opacity: 0.75;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .nav-btn:hover{ opacity: 1; }
  .nav-btn:active{ transform: scale(0.9); }
  .nav-btn svg{ width: 14px; height: 14px; }
  .nav-btn.is-open{ opacity: 1; color: var(--cream); }
  .player-label{
    display: flex;
    flex-direction: column;
    line-height: 1.25;
    color: var(--cream);
    white-space: nowrap;
    flex: 1 1 auto;
    min-width: 0;
    max-width: 23vw;
    overflow: hidden;
  }
  .player-label .title{
    font-size: 13px;
    letter-spacing: 0.02em;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
  }
  .player-label .status{
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.65;
  }
  .player-label .listeners{
    font-size: 10px;
    letter-spacing: 0.04em;
    opacity: 0.6;
    margin-top: 1px;
  }
  .eq{
    display: flex;
    align-items: center;
    gap: 3px;
    height: 14px;
    margin-left: 3px;
  }
  .eq i{
    width: 3px;
    background: var(--cream);
    opacity: 0.85;
    border-radius: 1px;
    height: 4px;
  }
  .player.is-playing .eq i{ animation: eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(1){ animation-delay: 0s; }
  .eq i:nth-child(2){ animation-delay: 0.15s; }
  .eq i:nth-child(3){ animation-delay: 0.3s; }
  @keyframes eq{
    0%, 100%{ height: 4px; }
    50%{ height: 13px; }
  }
  /* the actual YouTube video is loaded here, kept off-screen -- audio still plays */
  #yt-player{
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  @media (max-width: 480px){
    .player{ padding: 7px 13px 7px 7px; gap: 6px; }
    .play-btn{ width: 38px; height: 38px; }
    .nav-btn{ width: 27px; height: 27px; }
    .seek-wrap{ padding: 7px 13px; }
    /* there's actually plenty of room here once the buttons + gaps are
       accounted for -- the old 21vw cap was truncating song titles far
       earlier than it needed to */
    .player-label{ max-width: min(150px, 40vw); }
  }
  /* top-center clock, 12-hour format */
  .top-center-clock{
    position: absolute;
    top: calc(18px + env(safe-area-inset-top, 0px));
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    color: var(--cream);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.03em;
    text-shadow: 0 3px 10px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  /* left-side stack: live listener count + today's pick, one under the other */
  .top-left-stack{
    position: absolute;
    top: calc(17px + env(safe-area-inset-top, 0px));
    left: calc(17px + env(safe-area-inset-left, 0px));
    z-index: 5;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 8px;
  }
  .top-left-widget{
    color: var(--cream);
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    background: rgba(24, 7, 5, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 17px;
    line-height: 1.3;
    pointer-events: none;
  }
  .top-left-widget .live{
    font-size: 12px;
    letter-spacing: 0.04em;
    opacity: 0.85;
    display: flex;
    align-items: center;
    gap: 7px;
    white-space: nowrap;
  }
  .top-left-widget .dot{
    width: 7px;
    height: 7px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #2ecc71;
    box-shadow: 0 0 7px #2ecc71;
    animation: tlw-pulse 1.4s infinite;
  }
  @keyframes tlw-pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.4; }
  }
  /* today's featured song -- picked deterministically from the playlist,
     same for every visitor, rolls over to a new pick at 6 AM */
  .daily-pick-widget{
    color: var(--cream);
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    background: rgba(24, 7, 5, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 9px 17px;
    line-height: 1.3;
    max-width: 220px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .daily-pick-widget:hover{ background: rgba(24, 7, 5, 0.72); }
  .daily-pick-label{
    font-size: 9px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.6;
    display: flex;
    align-items: center;
    gap: 5px;
    white-space: nowrap;
  }
  .daily-pick-title{
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-top: 2px;
  }
  @media (max-width: 480px){
    .top-center-clock{ font-size: 18px; top: calc(13px + env(safe-area-inset-top, 0px)); }
    .top-left-stack{ top: calc(10px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); gap: 6px; }
    .top-left-widget{ padding: 9px 13px; }
    .top-left-widget .live{ font-size: 10px; }
    .daily-pick-widget{ padding: 7px 13px; max-width: 160px; }
    .daily-pick-title{ font-size: 11px; }
    .daily-pick-label{ font-size: 8px; }
  }
  /* shown only inside Instagram/Facebook/TikTok/etc's in-app browser,
     since those WebViews block audio the real Chrome/Safari allow */
  #inAppBanner{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    background: #180705;
    color: var(--cream);
    padding: calc(10px + env(safe-area-inset-top, 0px)) 14px 10px;
    font-size: 13px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--line);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
  }
  #inAppBanner .iab-text{ flex: 1 1 auto; }
  #inAppBanner .iab-open-btn{
    flex: 0 0 auto;
    background: var(--cream);
    color: var(--black);
    border: none;
    border-radius: 999px;
    padding: 7px 13px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #inAppBanner .iab-close{
    background: none;
    border: none;
    color: var(--cream);
    opacity: 0.7;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    flex: 0 0 auto;
    padding: 0 2px;
  }
  /* small contact tag, bottom-right corner */
  .contact-tag{
    position: absolute;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    right: calc(14px + env(safe-area-inset-right, 0px));
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: rgba(24, 7, 5, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 13px;
    padding: 7px 10px;
  }
  .contact-tag a{
    display: flex;
    align-items: center;
    gap: 7px;
    color: var(--cream);
    opacity: 0.75;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }
  .contact-tag a:hover{ opacity: 1; }
  .contact-tag svg{ width: 13px; height: 13px; flex: 0 0 auto; }
  @media (max-width: 480px){
    /* moved to the top-right on small screens -- the bottom corners get
       crowded fast between the player dock and the chat button, and the
       top-right is otherwise empty */
    .contact-tag{
      top: calc(10px + env(safe-area-inset-top, 0px));
      right: calc(10px + env(safe-area-inset-right, 0px));
      bottom: auto;
      padding: 7px 9px;
    }
    .contact-tag a{ font-size: 9px; }
  }
  /* live chat -- toggle button + slide-up drawer, bottom-left corner */
  .chat-toggle-btn{
    position: absolute;
    bottom: calc(14px + env(safe-area-inset-bottom, 0px));
    left: calc(14px + env(safe-area-inset-left, 0px));
    z-index: 6;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    border: 1px solid var(--line);
    background: rgba(24, 7, 5, 0.6);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    color: var(--cream);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    box-shadow: 0 10px 26px rgba(0,0,0,0.35);
  }
  .chat-toggle-btn svg{ width: 20px; height: 20px; }
  .chat-badge{
    position: absolute;
    top: -4px;
    right: -4px;
    min-width: 18px;
    height: 18px;
    padding: 0 4px;
    border-radius: 999px;
    background: #ff3b30;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    line-height: 18px;
    text-align: center;
    box-shadow: 0 0 0 2px rgba(24,7,5,0.9);
    animation: chat-badge-pulse 1.6s ease-in-out infinite;
  }
  .chat-badge[hidden]{ display: none; }
  @keyframes chat-badge-pulse{
    0%, 100%{ transform: scale(1); }
    50%{ transform: scale(1.12); }
  }
  .chat-panel{
    position: absolute;
    left: calc(14px + env(safe-area-inset-left, 0px));
    bottom: calc(70px + env(safe-area-inset-bottom, 0px));
    z-index: 6;
    width: min(400px, 92vw);
    max-height: min(580px, 74vh);
    display: flex;
    flex-direction: column;
    background: rgba(24, 7, 5, 0.85);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 10px 31px rgba(0,0,0,0.4);
    overflow: hidden;
  }
  .chat-panel[hidden]{ display: none; }
  .chat-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 10px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--cream);
    font-size: 11px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.85;
    flex: 0 0 auto;
  }
  .chat-close-btn{
    background: none;
    border: none;
    color: var(--cream);
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    opacity: 0.7;
    padding: 0 2px;
  }
  .chat-close-btn:hover{ opacity: 1; }
  .chat-messages{
    flex: 1 1 auto;
    overflow-y: auto;
    padding: 10px 12px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-height: 200px;
    scrollbar-width: thin;
    scrollbar-color: var(--line) transparent;
  }
  /* transparent, theme-tinted scrollbars -- same treatment on the queue
     panel so both scrollable widgets look consistent */
  .chat-messages::-webkit-scrollbar,
  .queue-panel::-webkit-scrollbar{
    width: 6px;
  }
  .chat-messages::-webkit-scrollbar-track,
  .queue-panel::-webkit-scrollbar-track{
    background: transparent;
  }
  .chat-messages::-webkit-scrollbar-thumb,
  .queue-panel::-webkit-scrollbar-thumb{
    background: var(--line);
    border-radius: 999px;
  }
  .chat-messages::-webkit-scrollbar-thumb:hover,
  .queue-panel::-webkit-scrollbar-thumb:hover{
    background: rgba(238,221,192,0.55);
  }
  .chat-msg{
    font-size: 12.5px;
    color: var(--cream);
    line-height: 1.35;
    word-break: break-word;
  }
  .chat-msg .chat-name{
    font-weight: 600;
    opacity: 0.95;
    margin-right: 5px;
    color: #ff8b7a;
  }
  .chat-msg-song{
    font-size: 10px;
    letter-spacing: 0.02em;
    opacity: 0.55;
    margin-top: 2px;
    margin-left: 1px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .chat-empty{
    opacity: 0.5;
    font-size: 12px;
    text-align: center;
    margin-top: 20px;
    color: var(--cream);
  }
  .chat-input-area{
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    gap: 6px;
    padding: 10px;
    border-top: 1px solid var(--line);
  }
  .chat-name-input{
    width: 100%;
    background: rgba(238,221,192,0.08);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 6px 12px;
    color: var(--cream);
    font-size: 11px;
    outline: none;
    font-family: inherit;
  }
  .chat-input-line2{
    display: flex;
    gap: 6px;
  }
  .chat-text-input{
    flex: 1 1 auto;
    min-width: 0;
    background: rgba(238,221,192,0.08);
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 8px 12px;
    color: var(--cream);
    font-size: 12px;
    outline: none;
    font-family: inherit;
  }
  .chat-name-input::placeholder, .chat-text-input::placeholder{ color: rgba(238,221,192,0.5); }
  .chat-send-btn{
    flex: 0 0 auto;
    border: none;
    border-radius: 999px;
    background: var(--cream);
    color: var(--black);
    padding: 8px 15px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
  }
  @media (max-width: 480px){
    .chat-toggle-btn{
      bottom: calc(10px + env(safe-area-inset-bottom, 0px));
      left: calc(10px + env(safe-area-inset-left, 0px));
      width: 40px;
      height: 40px;
    }
    .chat-panel{
      left: calc(10px + env(safe-area-inset-left, 0px));
      bottom: calc(64px + env(safe-area-inset-bottom, 0px));
      width: min(340px, 94vw);
      max-height: 64vh;
    }
    /* iOS Safari auto-zooms the whole page when a focused input's font is
       under 16px -- keeping these at 16px avoids that jarring zoom-in
       every time someone taps into chat on a phone */
    .chat-name-input, .chat-text-input{ font-size: 16px; }
    .chat-send-btn{ font-size: 13px; padding: 8px 13px; }
  }
</style>
</head>
<body>
<div class="hero">
  <div class="hero-bg" id="heroBgA"></div>
  <div class="hero-bg" id="heroBgB"></div>
  <div class="top-center-clock" id="liveClock">--:-- --</div>
  <div class="top-left-stack" id="topLeftStack">
    <div class="top-left-widget" id="topLeftWidget">
      <div class="live"><span class="dot"></span><span id="topListenerCount">-- people on 9XM</span></div>

<script>
  var PLAYLIST_ID = 'PLGLkhTDJJKA_oB2JYb4INru1mrcXRYLc5';
  var ytPlayer, ready = false, playing = false, pendingClick = false, hasUnlocked = false;
  var playerEl = document.getElementById('player');
  var playerDock = document.getElementById('playerDock');
  var playBtn = document.getElementById('playBtn');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var queueBtn = document.getElementById('queueBtn');
  var queuePanel = document.getElementById('queuePanel');
  var queueList = document.getElementById('queueList');
  var statusText = document.getElementById('statusText');
  var titleText = document.getElementById('titleText');
  var seekBar = document.getElementById('seekBar');
  var curTimeEl = document.getElementById('curTime');
  var durTimeEl = document.getElementById('durTime');
  var SEEK_RESOLUTION = 1000;
  var isScrubbing = false;
  var queueOpen = false;
  // -- rotating background images -----------------------------------------
  // pulled from the 9xm_back folder in the repo. one is picked at random on
  // page load, then swapped for a different random one every time the
  // track actually changes (manual prev/next, daily pick, queue click, or
  // natural auto-advance -- all of those funnel through onStateChange below).
  // add more filenames to this array as more images get added to the folder.
  var BACKGROUND_IMAGES = [
    '9xm_back/image2.jpeg',
    '9xm_back/image1.jpeg',
    '9xm_back/image3.jpeg'
  ];
  // two stacked layers (see the .hero-bg CSS) so a track change can
  // crossfade into the new image instead of snapping to it instantly.
  var heroBgLayers = [document.getElementById('heroBgA'), document.getElementById('heroBgB')];
  var activeBgLayerIndex = 0;
  var lastBgIndex = -1;
  var currentBgVideoId = null;
  function pickRandomBackground(){
    if (!BACKGROUND_IMAGES.length || !heroBgLayers[0] || !heroBgLayers[1]) return;
    var idx = 0;
    if (BACKGROUND_IMAGES.length > 1){
      // avoid picking the same image twice in a row
      do { idx = Math.floor(Math.random() * BACKGROUND_IMAGES.length); } while (idx === lastBgIndex);
    }
    lastBgIndex = idx;
    var url = BACKGROUND_IMAGES[idx];
    var nextLayerIndex = activeBgLayerIndex === 0 ? 1 : 0;
    var nextLayer = heroBgLayers[nextLayerIndex];
    var currentLayer = heroBgLayers[activeBgLayerIndex];
    // preload before crossfading -- otherwise, on a slow connection, the
    // fade-in would start against a still-blank layer and the image would
    // just pop in abruptly after the fade already finished
    var preloader = new Image();
    preloader.onload = function(){
      nextLayer.style.backgroundImage = "url('" + url + "')";
      nextLayer.classList.add('is-visible');
      currentLayer.classList.remove('is-visible');
      activeBgLayerIndex = nextLayerIndex;
    };
    preloader.onerror = function(){
      console.error('[9XM] background image failed to load:', url);
    };
    preloader.src = url;
  }
  pickRandomBackground();
  function setStatus(text){ statusText.textContent = text; }
  function setPlayingState(state){
    playing = state;
    playerEl.classList.toggle('is-playing', state);
    setStatus(state ? 'Now playing' : 'Paused');
  }
  function updateSongTitle(){
    try{
      var data = ytPlayer.getVideoData();
      if (data && data.title){ titleText.textContent = data.title; }
    } catch(e){}
  }
  function unlockAudio(){
    // called from directly inside a real tap/click -- this is what mobile browsers
    // require before they'll let audio become audible. the track is already
    // playing muted (started in onReady), so this just switches it audible.
    if (hasUnlocked) return;
    hasUnlocked = true;
    try{
      ytPlayer.unMute();
      ytPlayer.setVolume(100);
      ytPlayer.playVideo();
    } catch(e){}
    setPlayingState(true);
  }
  function formatTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' + s : s);
  }
  function paintSeek(pct){
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    seekBar.style.background = 'linear-gradient(to right, #eeddc0 0%, #eeddc0 ' + pct + '%, rgba(238,221,192,0.25) ' + pct + '%, rgba(238,221,192,0.25) 100%)';
  }
  function pollProgress(){
    if (!ready || isScrubbing || !ytPlayer) return;
    try{
      var dur = ytPlayer.getDuration();
      var cur = ytPlayer.getCurrentTime();
      if (dur > 0){
        var pct = (cur / dur) * 100;
        seekBar.value = Math.round((cur / dur) * SEEK_RESOLUTION);
        paintSeek(pct);
        curTimeEl.textContent = formatTime(cur);
        durTimeEl.textContent = formatTime(dur);
      }
    } catch(e){}
  }
  seekBar.addEventListener('input', function(){
    isScrubbing = true;
    var pct = (seekBar.value / SEEK_RESOLUTION) * 100;
    paintSeek(pct);
    try{
      if (ready && ytPlayer){
        var dur = ytPlayer.getDuration();
        if (dur > 0){ curTimeEl.textContent = formatTime((seekBar.value / SEEK_RESOLUTION) * dur); }
      }
    } catch(e){}
  });
  function commitSeek(){
    if (ready && ytPlayer){
      try{
        var dur = ytPlayer.getDuration();
        if (dur > 0){
          var target = (seekBar.value / SEEK_RESOLUTION) * dur;
          ytPlayer.seekTo(target, true);
        }
      } catch(e){}
    }
    isScrubbing = false;
  }
  seekBar.addEventListener('change', commitSeek);
  seekBar.addEventListener('mouseup', commitSeek);
  seekBar.addEventListener('touchend', commitSeek);
  // -- "up next" queue --------------------------------------------------
  var titleCache = {};
  function fetchTitle(videoId, el){
    // avoid re-requesting a title we already have -- the queue panel can
    // rebuild while a track is playing, and without this cache every
    // rebuild re-fetched the exact same titles from YouTube all over again
    if (titleCache[videoId]){
      el.textContent = titleCache[videoId];
      return;
    }
    fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + videoId) + '&format=json')
      .then(function(res){ if (!res.ok) throw new Error('oembed failed'); return res.json(); })
      .then(function(data){
        if (data && data.title){
          titleCache[videoId] = data.title;
          el.textContent = data.title;
        }
      })
      .catch(function(){ /* leave the "Track N" fallback already in place */ });
  }
  // -- "today's 9XM pick" -------------------------------------------------
  // a single featured song, picked the same way for every visitor (hashed
  // from the date), that rolls over to a new pick at 6 AM instead of
  // midnight.
  var dailyPickWidget = document.getElementById('dailyPickWidget');
  var dailyPickTitleEl = document.getElementById('dailyPickTitle');
  var dailyPickVideoId = null;
  var dailyPickDateKey = null;
  var dailyPickPlaylistIds = null;
  function hashStringToInt(str){
    var hash = 0;
    for (var i = 0; i < str.length; i++){
      hash = ((hash << 5) - hash + str.charCodeAt(i)) | 0;
    }
    return Math.abs(hash);
  }
  function getPickDateKey(){
    // the "pick day" rolls over at 6 AM local time, not midnight -- so
    // 2:00 AM still counts as the previous day's pick
    var now = new Date();
    var effective = new Date(now.getTime());
    if (now.getHours() < 6){ effective.setDate(effective.getDate() - 1); }
    return effective.getFullYear() + '-' + (effective.getMonth() + 1) + '-' + effective.getDate();
  }
  function applyDailyPick(){
    if (!dailyPickPlaylistIds || !dailyPickPlaylistIds.length) return;
    var dateKey = getPickDateKey();
    if (dateKey === dailyPickDateKey) return; // already showing the right pick
    dailyPickDateKey = dateKey;
    var index = hashStringToInt(dateKey) % dailyPickPlaylistIds.length;
    dailyPickVideoId = dailyPickPlaylistIds[index];
    dailyPickTitleEl.textContent = 'Loading...';
    fetchTitle(dailyPickVideoId, dailyPickTitleEl);
    console.log('[9XM] today\'s pick (' + dateKey + '): index', index, 'of', dailyPickPlaylistIds.length, '-- video', dailyPickVideoId);
  }
  function setupDailyPick(canonicalIds){
    if (!canonicalIds || !canonicalIds.length){
      console.warn('[9XM] daily pick: playlist came back empty, skipping.');
      return;
    }
    dailyPickPlaylistIds = canonicalIds;
    applyDailyPick();
    // check every few minutes so a tab left open overnight rolls over to
    // the new pick on its own, without needing a page refresh
    setInterval(applyDailyPick, 5 * 60 * 1000);
  }
  dailyPickWidget.addEventListener('click', function(){
    if (!ready || !dailyPickVideoId) return;
    if (!hasUnlocked){ unlockAudio(); }
    try{
      // playVideoAt (not loadVideoById!) keeps the player inside playlist
      // mode -- loadVideoById was detaching it from the playlist entirely,
      // which is why the queue panel went empty and next/prev stopped
      // working after tapping today's pick.
      var currentIds = ytPlayer.getPlaylist();
      var idx = currentIds ? currentIds.indexOf(dailyPickVideoId) : -1;
      if (idx >= 0){
        ytPlayer.playVideoAt(idx);
      } else {
        // shouldn't normally happen -- same playlist, just a different
        // (shuffled) order -- but fall back safely just in case
        console.warn('[9XM] daily pick video not found in current playlist order, falling back to loadVideoById.');
        ytPlayer.loadVideoById(dailyPickVideoId);
      }
      ytPlayer.playVideo();
    } catch(e){ console.error('[9XM] failed to play daily pick', e); }
  });
  dailyPickWidget.addEventListener('keydown', function(e){
    if (e.key === 'Enter' || e.key === ' '){ e.preventDefault(); dailyPickWidget.click(); }
  });
  function closeQueue(){
    queueOpen = false;
    queuePanel.hidden = true;
    queueBtn.classList.remove('is-open');
    queueBtn.setAttribute('aria-expanded', 'false');
  }
  function buildQueue(){
    try{
      var ids = ytPlayer.getPlaylist();
      var idx = ytPlayer.getPlaylistIndex();
      if (!ids || !ids.length || idx < 0){
        queueList.innerHTML = '<li class="qempty">Queue not available yet.</li>';
        return;
      }
      var upcoming = [];
      for (var i = 1; i < ids.length; i++){
        upcoming.push({ videoId: ids[(idx + i) % ids.length], targetIndex: (idx + i) % ids.length });
      }
      if (!upcoming.length){
        queueList.innerHTML = '<li class="qempty">No other tracks in the playlist.</li>';
        return;
      }
      queueList.innerHTML = '';
      upcoming.forEach(function(item, i){
        var li = document.createElement('li');
        var num = document.createElement('span');
        num.className = 'qnum';
        num.textContent = (i + 1);
        var titleSpan = document.createElement('span');
        titleSpan.className = 'qtitle';
        titleSpan.textContent = 'Track ' + (i + 1);
        li.appendChild(num);
        li.appendChild(titleSpan);
        li.addEventListener('click', function(){
          if (!hasUnlocked) unlockAudio();
          ytPlayer.playVideoAt(item.targetIndex);
          ytPlayer.playVideo();
          closeQueue();
        });
        queueList.appendChild(li);
        fetchTitle(item.videoId, titleSpan);
      });
    } catch(e){
      console.error('[9XM] queue build failed', e);
      queueList.innerHTML = '<li class="qempty">Queue not available yet.</li>';
    }
  }
  queueBtn.addEventListener('click', function(){
    if (!ready) return;
    if (queueOpen){
      closeQueue();
    } else {
      queueOpen = true;
      queuePanel.hidden = false;
      queueBtn.classList.add('is-open');
      queueBtn.setAttribute('aria-expanded', 'true');
      buildQueue();
    }
  });
  document.addEventListener('click', function(e){
    if (!queueOpen) return;
    if (!playerDock.contains(e.target)) closeQueue();
  });
  console.log('[9XM] page loaded, requesting YouTube iframe API script...');
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function(){ console.error('[9XM] FAILED to load https://www.youtube.com/iframe_api -- this script is being blocked (ad blocker / firewall / offline).'); };
  document.head.appendChild(tag);
  setTimeout(function(){
    if (typeof YT === 'undefined'){
      console.error('[9XM] 5s after page load, window.YT is still undefined -- the iframe_api script never ran. Check the Network tab for a blocked/failed request to youtube.com, and check for ad-blocker / privacy extensions.');
    } else if (!ready){
      console.warn('[9XM] YT loaded but the player never fired onReady yet.');
    }
  }, 5000);
  window.onYouTubeIframeAPIReady = function(){
    console.log('[9XM] YouTube iframe API loaded. Creating player with playlist', PLAYLIST_ID);
    ytPlayer = new YT.Player('yt-player', {
      height: '1',
      width: '1',
      playerVars: {
        listType: 'playlist',
        list: PLAYLIST_ID,
        autoplay: 0,
        controls: 0,
        playsinline: 1
      },
      events: {
        onReady: function(){
          console.log('[9XM] player onReady fired. ready = true.');
          ready = true;
          try{
            ytPlayer.mute();
            // grab the playlist's real order BEFORE turning shuffle on --
            // this is the same order for every visitor, which is what makes
            // "today's pick" land on the same song for everyone
            var canonicalIds = ytPlayer.getPlaylist();
            setupDailyPick(canonicalIds);
            // shuffle mode -- so next/previous (and auto-advance) pick a random
            // track instead of walking the playlist in order
            ytPlayer.setShuffle(true);
            var ids = ytPlayer.getPlaylist();
            if (ids && ids.length){
              // jump straight to a random track instead of always starting at #1
              var randomIndex = Math.floor(Math.random() * ids.length);
              console.log('[9XM] shuffling in -- starting at random track', randomIndex, 'of', ids.length);
              ytPlayer.playVideoAt(randomIndex);
            } else {
              ytPlayer.playVideo();
            }
          } catch(e){}
          // start the stream muted right away -- muted autoplay is allowed on every
          // mobile browser, so the track is already rolling by the time someone taps play
          if (pendingClick){ pendingClick = false; console.log('[9XM] a tap was waiting -- unlocking audio now.'); unlockAudio(); }
        },
        onStateChange: function(e){
          console.log('[9XM] onStateChange, e.data =', e.data, '(-1 unstarted, 0 ended, 1 playing, 2 paused, 3 buffering, 5 cued)');
          if (hasUnlocked){
            if (e.data === YT.PlayerState.PLAYING) setPlayingState(true);
            else if (e.data === YT.PlayerState.PAUSED) setPlayingState(false);
            else if (e.data === YT.PlayerState.ENDED) setPlayingState(false);
          }
          if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.BUFFERING || e.data === 5){
            updateSongTitle();
            // background image (and, below, the queue rebuild) only need to
            // react when the track has actually changed -- BUFFERING/PLAYING/
            // CUED can all fire multiple times for the *same* still-playing
            // track, and re-doing this work every single time was wasted effort
            var trackChanged = false;
            try{
              var vidData = ytPlayer.getVideoData();
              var newVideoId = vidData && vidData.video_id;
              if (newVideoId && newVideoId !== currentBgVideoId){
                currentBgVideoId = newVideoId;
                trackChanged = true;
                pickRandomBackground();
              }
            } catch(e2){}
            if (queueOpen && trackChanged) buildQueue();
          }
        },
        onError: function(e){
          console.error('[9XM] onError, e.data =', e.data, '(2 invalid id, 5 html5 error, 100 not found/private, 101/150 embedding disabled by video owner) -- skipping to next track.');
          ytPlayer.nextVideo();
        }
      }
    });
  };
  playBtn.addEventListener('click', function(){
    console.log('[9XM] play button clicked. ready =', ready, 'playing =', playing, 'hasUnlocked =', hasUnlocked);
    if (!ready){ pendingClick = true; console.log('[9XM] not ready yet -- will unlock audio once the player fires onReady.'); return; }
    if (!hasUnlocked){ unlockAudio(); return; }
    if (playing){
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });
  prevBtn.addEventListener('click', function(){
    if (!ready) return;
    if (!hasUnlocked) unlockAudio();
    ytPlayer.previousVideo();
    ytPlayer.playVideo();
  });
  nextBtn.addEventListener('click', function(){
    if (!ready) return;
    if (!hasUnlocked) unlockAudio();
    ytPlayer.nextVideo();
    ytPlayer.playVideo();
  });
  (function(){
    var clockEl = document.getElementById('liveClock');
    function pad(n){ return n < 10 ? '0' + n : n; }
    function tick(){
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      clockEl.textContent = h + ':' + pad(m) + ' ' + ampm;
    }
    tick();
    setInterval(tick, 1000);
  })();
  (function(){
    // Instagram/Facebook/TikTok/Snapchat/Line/WeChat open links in their own
    // built-in browser (a "WebView"), not the phone's real Chrome/Safari.
    // Those WebViews often block audio/autoplay far more aggressively than
    // a real browser, and no page-level fix can override that -- the only
    // reliable fix is telling the visitor to open the link in a real browser.
    var ua = navigator.userAgent || '';
    var isInApp = /Instagram|FBAN|FBAV|Line\/|MicroMessenger|Snapchat/i.test(ua);
    if (!isInApp) return;
    console.warn('[9XM] in-app browser detected, UA:', ua);
    var banner = document.createElement('div');
    banner.id = 'inAppBanner';
    var text = document.createElement('div');
    text.className = 'iab-text';
    text.innerHTML = 'Music won\'t play in this in-app browser. Tap the <strong>&#8942;</strong> or <strong>&#8226;&#8226;&#8226;</strong> menu above and choose <strong>"Open in Browser"</strong>.';
    banner.appendChild(text);
    if (/Android/i.test(ua)){
      var openBtn = document.createElement('button');
      openBtn.className = 'iab-open-btn';
      openBtn.textContent = 'Open in Chrome';
      openBtn.addEventListener('click', function(){
        var target = location.href.replace(/^https?:\/\//, '');
        window.location = 'intent://' + target + '#Intent;scheme=https;package=com.android.chrome;end';
      });
      banner.appendChild(openBtn);
    }
    var closeBtn = document.createElement('button');
    closeBtn.className = 'iab-close';
    closeBtn.setAttribute('aria-label', 'Dismiss');
    closeBtn.innerHTML = '&times;';
    closeBtn.addEventListener('click', function(){ banner.remove(); });
    banner.appendChild(closeBtn);
    document.body.appendChild(banner);
  })();
  // -- live chat (like a YouTube live stream chat) -----------------------
  (function(){
    var chatToggleBtn = document.getElementById('chatToggleBtn');
    var chatPanel = document.getElementById('chatPanel');
    var chatCloseBtn = document.getElementById('chatCloseBtn');
    var chatMessagesEl = document.getElementById('chatMessages');
    var chatNameInput = document.getElementById('chatNameInput');
    var chatTextInput = document.getElementById('chatTextInput');
    var chatSendBtn = document.getElementById('chatSendBtn');
    var chatBadge = document.getElementById('chatBadge');
    var CHAT_NAME_KEY = '9xm_chat_name';
    var MIN_SEND_GAP_MS = 2500; // basic spam guard -- one message every 2.5s
    var lastSendAt = 0;
    var unreadCount = 0;
    try{
      var savedName = localStorage.getItem(CHAT_NAME_KEY);
      if (savedName) chatNameInput.value = savedName;
    } catch(e){}
    function updateChatBadge(){
      if (unreadCount > 0){
        chatBadge.hidden = false;
        chatBadge.textContent = unreadCount > 9 ? '9+' : String(unreadCount);
      } else {
        chatBadge.hidden = true;
      }
    }
    function openChat(){
      chatPanel.hidden = false;
      chatToggleBtn.setAttribute('aria-expanded', 'true');
      chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
      unreadCount = 0;
      updateChatBadge();
    }
    function closeChat(){
      chatPanel.hidden = true;
      chatToggleBtn.setAttribute('aria-expanded', 'false');
    }
    chatToggleBtn.addEventListener('click', function(){
      if (chatPanel.hidden) openChat(); else closeChat();
    });
    chatCloseBtn.addEventListener('click', closeChat);
    function sendChatMessage(){
      var name = (chatNameInput.value || '').trim().slice(0, 20) || 'Anonymous';
      var text = (chatTextInput.value || '').trim().slice(0, 200);
      if (!text) return;
      var now = Date.now();
      if (now - lastSendAt < MIN_SEND_GAP_MS){ return; }
      lastSendAt = now;
      try{ localStorage.setItem(CHAT_NAME_KEY, name); } catch(e){}
      chatTextInput.value = '';
      // tag the message with whatever song is showing in the player right
      // now, but only once something has actually started playing --
      // otherwise it's just the placeholder "9XM Wali Subah" text
      var song = '';
      try{
        var currentTitle = (titleText.textContent || '').trim();
        if (currentTitle && currentTitle !== '9XM Wali Subah') song = currentTitle.slice(0, 120);
      } catch(e){}
      window.dispatchEvent(new CustomEvent('9xm-chat-send', { detail: { name: name, text: text, song: song } }));
    }
    chatSendBtn.addEventListener('click', sendChatMessage);
    chatTextInput.addEventListener('keydown', function(e){
      if (e.key === 'Enter'){ e.preventDefault(); sendChatMessage(); }
    });
    // called from the Firebase module script below whenever a chat message
    // (new or already-existing) comes in through the real-time listener.
    // isNew is false for the initial history batch loaded on page open, and
    // true for anything that arrives afterwards -- only the latter should
    // bump the unread badge on the minimized chat icon.
    window.renderChatMessage = function(name, text, song, isNew){
      var wasNearBottom = (chatMessagesEl.scrollTop + chatMessagesEl.clientHeight) >= (chatMessagesEl.scrollHeight - 30);
      var emptyEl = chatMessagesEl.querySelector('.chat-empty');
      if (emptyEl) emptyEl.remove();
      var line = document.createElement('div');
      line.className = 'chat-msg';
      var nameSpan = document.createElement('span');
      nameSpan.className = 'chat-name';
      nameSpan.textContent = name + ':';
      var textSpan = document.createElement('span');
      textSpan.textContent = text;
      line.appendChild(nameSpan);
      line.appendChild(textSpan);
      if (song){
        var songLine = document.createElement('div');
        songLine.className = 'chat-msg-song';
        songLine.textContent = '🎵 listening to ' + song;
        line.appendChild(songLine);
      }
      chatMessagesEl.appendChild(line);
      // keep the DOM from growing forever on a long-running tab
      while (chatMessagesEl.children.length > 150){ chatMessagesEl.removeChild(chatMessagesEl.firstChild); }
      if (wasNearBottom) chatMessagesEl.scrollTop = chatMessagesEl.scrollHeight;
      if (isNew && chatPanel.hidden){
        unreadCount++;
        updateChatBadge();
      }
    };
    if (!chatMessagesEl.children.length){
      chatMessagesEl.innerHTML = '<div class="chat-empty">No messages yet. Say hi!</div>';
    }
  })();
  setInterval(pollProgress, 1000);
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getFirestore, doc, setDoc, deleteDoc, serverTimestamp,
    collection, query,
    addDoc, orderBy, limit, onSnapshot
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
  var firebaseConfig = {
    apiKey: "AIzaSyBscSBX8D07YtoLW_rG1I6WcXqqyihfYwI",
    authDomain: "xmmorning.firebaseapp.com",
    projectId: "xmmorning",
    storageBucket: "xmmorning.firebasestorage.app",
    messagingSenderId: "689020702250",
    appId: "1:689020702250:web:5b7186559cc578b27ebd53"
  };
  var app = initializeApp(firebaseConfig);
  var db = getFirestore(app);
  var CLIENT_ID = 'v-' + Math.random().toString(36).slice(2) + '-' + Date.now().toString(36);
  var HEARTBEAT_MS = 20000;   // re-announce "still here" every 20s
  var STALE_MS = 75000;       // anyone silent for 75s no longer counts as online
                               // (kept generous so a backgrounded/other-tab listener,
                               // whose heartbeat timer can get throttled by the
                               // browser, doesn't get wrongly dropped between beats)
  var listenerEl = document.getElementById('listenerCount');
  var topListenerEl = document.getElementById('topListenerCount');
  function heartbeat(){
    setDoc(doc(db, 'presence', CLIENT_ID), { lastSeen: serverTimestamp() })
      .catch(function(e){ console.error('[9XM presence] heartbeat failed', e); });
  }
  function cleanupSelf(){
    deleteDoc(doc(db, 'presence', CLIENT_ID)).catch(function(){});
  }
  // -- listener count: real-time instead of polling ----------------------
  // previously this did a fresh getDocs() query every 10 seconds, from
  // every visitor's tab, forever. that's a repeated network round trip per
  // visitor and a fresh Firestore read every single time regardless of
  // whether anything actually changed. onSnapshot instead pushes updates
  // only when the presence collection actually changes (someone joins or
  // leaves), so the count updates instantly and far fewer reads happen.
  var latestPresenceDocs = [];
  function recomputeListenerCount(){
    var cutoffMs = Date.now() - STALE_MS;
    var n = 0;
    for (var i = 0; i < latestPresenceDocs.length; i++){
      var ts = latestPresenceDocs[i].lastSeen;
      if (ts && typeof ts.toMillis === 'function' && ts.toMillis() > cutoffMs) n++;
    }
    var label = n + (n === 1 ? ' person on 9XM' : ' people on 9XM');
    if (listenerEl) listenerEl.textContent = label;
    if (topListenerEl) topListenerEl.textContent = label;
  }
  onSnapshot(collection(db, 'presence'), function(snap){
    latestPresenceDocs = snap.docs.map(function(d){ return d.data(); });
    recomputeListenerCount();
  }, function(e){ console.error('[9XM presence] listen failed', e); });
  heartbeat();
  setInterval(heartbeat, HEARTBEAT_MS);
  // this re-check makes no network call at all -- it just re-filters the
  // already-cached snapshot data, to catch someone going stale purely from
  // time passing (no Firestore write happens just because a clock ticks)
  setInterval(recomputeListenerCount, 10000);
  // only clean up presence when the page is actually being closed/navigated away
  // from -- NOT on visibilitychange. switching tabs or backgrounding the browser
  // (music kept playing) also fires "hidden", which was wrongly making
  // still-listening people vanish from the count. pagehide is included
  // alongside beforeunload because mobile browsers (iOS Safari especially)
  // don't reliably fire beforeunload.
  window.addEventListener('beforeunload', cleanupSelf);
  window.addEventListener('pagehide', cleanupSelf);
  // re-announce presence immediately the moment a backgrounded/throttled tab
  // becomes visible again, so the count recovers fast instead of waiting for
  // the next regular heartbeat tick
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'visible') heartbeat();
  });
  // -- live chat: real-time listen + send --------------------------------
  var chatCollectionRef = collection(db, 'chat_messages');
  var chatQuery = query(chatCollectionRef, orderBy('createdAt', 'desc'), limit(50));
  var chatSeenIds = {};
  var chatIsFirstSnapshot = true; // the initial batch is history, not "new" -- shouldn't badge it
  onSnapshot(chatQuery, function(snap){
    // Firestore gives newest-first (for the limit(50) to work) -- flip it
    // back to oldest-first so messages render top-to-bottom like a chat.
    var docsOldestFirst = snap.docs.slice().reverse();
    var isNew = !chatIsFirstSnapshot;
    docsOldestFirst.forEach(function(d){
      if (chatSeenIds[d.id]) return;
      chatSeenIds[d.id] = true;
      var data = d.data();
      if (window.renderChatMessage){
        window.renderChatMessage(data.name || 'Anonymous', data.text || '', data.song || '', isNew);
      }
    });
    chatIsFirstSnapshot = false;
  }, function(e){ console.error('[9XM chat] listen failed', e); });
  window.addEventListener('9xm-chat-send', function(e){
    var detail = e.detail || {};
    var name = (detail.name || 'Anonymous').toString().slice(0, 20);
    var text = (detail.text || '').toString().slice(0, 200);
    var song = (detail.song || '').toString().slice(0, 120);
    if (!text) return;
    addDoc(chatCollectionRef, { name: name, text: text, song: song, createdAt: serverTimestamp() })
      .catch(function(err){ console.error('[9XM chat] send failed', err); });
  });
</script>
