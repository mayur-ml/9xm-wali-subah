<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>9XM Wali Subah</title>
<meta name="description" content="9XM Wali Subah -- press play for a straight shot of 90s & 2000s Bollywood.">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream: #eeddc0;
    --black: #180705;
    --line: rgba(238,221,192,0.35);
  }
  *{ box-sizing: border-box; }
  html, body{
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #4a0705;
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
  }
  .hero{
    position: relative;
    width: 100vw;
    height: 100vh;
    height: 100dvh;
    background-image: url('back_image.png');
    background-size: cover;
    background-position: 35% center;
    background-repeat: no-repeat;
  }

  /* dock holds the queue panel + seek bar + player pill together, bottom-centered */
  .player-dock{
    position: absolute;
    left: 50%;
    bottom: clamp(20px, 5vh, 44px);
    transform: translateX(-50%);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    width: min(480px, 86vw);
  }

  /* seek bar row */
  .seek-wrap{
    display: flex;
    align-items: center;
    gap: 8px;
    width: 100%;
    padding: 6px 16px;
    background: rgba(24, 7, 5, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
  }
  .seek-wrap .time{
    font-size: 10px;
    letter-spacing: 0.03em;
    color: var(--cream);
    opacity: 0.75;
    flex: 0 0 auto;
    min-width: 32px;
    text-align: center;
  }
  .seek-bar{
    flex: 1 1 auto;
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 4px;
    border-radius: 2px;
    background: rgba(238,221,192,0.25);
    outline: none;
    cursor: pointer;
  }
  .seek-bar::-webkit-slider-runnable-track{
    height: 4px;
    border-radius: 2px;
    background: transparent;
  }
  .seek-bar::-webkit-slider-thumb{
    -webkit-appearance: none;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: var(--cream);
    cursor: pointer;
    box-shadow: 0 0 4px rgba(0,0,0,0.4);
  }
  .seek-bar::-moz-range-track{
    height: 4px;
    border-radius: 2px;
    background: transparent;
  }
  .seek-bar::-moz-range-thumb{
    width: 12px;
    height: 12px;
    border: none;
    border-radius: 50%;
    background: var(--cream);
    cursor: pointer;
    box-shadow: 0 0 4px rgba(0,0,0,0.4);
  }

  /* "up next" queue dropdown */
  .queue-panel{
    width: 100%;
    background: rgba(24, 7, 5, 0.78);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 12px 14px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    max-height: 220px;
    overflow-y: auto;
  }
  .queue-panel[hidden]{ display: none; }
  .queue-title{
    font-size: 10px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--cream);
    opacity: 0.6;
    margin: 0 0 8px 4px;
  }
  .queue-list{
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
  .queue-list li{
    display: flex;
    align-items: center;
    gap: 10px;
    color: var(--cream);
    font-size: 12px;
    padding: 7px 8px;
    border-radius: 8px;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .queue-list li:hover{ background: rgba(238,221,192,0.1); }
  .queue-list li .qnum{
    opacity: 0.5;
    font-size: 10px;
    min-width: 14px;
    flex: 0 0 auto;
  }
  .queue-list li .qtitle{
    flex: 1 1 auto;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .queue-list .qempty{
    opacity: 0.5;
    font-size: 11px;
    padding: 6px 8px;
    cursor: default;
  }
  .queue-list .qempty:hover{ background: transparent; }

  /* small audio-only music player (video track hidden, custom controls) */
  .player{
    width: 100%;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 16px 8px 8px;
    background: rgba(24, 7, 5, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 999px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    overflow: hidden;
  }
  .play-btn{
    width: 40px;
    height: 40px;
    flex: 0 0 auto;
    border-radius: 50%;
    border: none;
    background: var(--cream);
    color: var(--black);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.15s ease;
  }
  .play-btn:hover{ transform: scale(1.06); }
  .play-btn:active{ transform: scale(0.96); }
  .play-btn svg{ width: 16px; height: 16px; }
  .play-btn .icon-pause{ display: none; }
  .player.is-playing .icon-play{ display: none; }
  .player.is-playing .icon-pause{ display: block; }
  .nav-btn{
    width: 26px;
    height: 26px;
    flex: 0 0 auto;
    border-radius: 50%;
    border: none;
    background: transparent;
    color: var(--cream);
    opacity: 0.75;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: opacity 0.15s ease, transform 0.15s ease;
  }
  .nav-btn:hover{ opacity: 1; }
  .nav-btn:active{ transform: scale(0.9); }
  .nav-btn svg{ width: 14px; height: 14px; }
  .nav-btn.is-open{ opacity: 1; color: var(--cream); }
  .player-label{
    display: flex;
    flex-direction: column;
    line-height: 1.25;
    color: var(--cream);
    white-space: nowrap;
    flex: 1 1 auto;
    min-width: 0;
    max-width: 28vw;
    overflow: hidden;
  }
  .player-label .title{
    font-size: 12px;
    letter-spacing: 0.02em;
    font-weight: 600;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    display: block;
  }
  .player-label .status{
    font-size: 10px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    opacity: 0.65;
  }
  .player-label .listeners{
    font-size: 10px;
    letter-spacing: 0.04em;
    opacity: 0.6;
    margin-top: 1px;
  }
  .eq{
    display: flex;
    align-items: center;
    gap: 2px;
    height: 14px;
    margin-left: 2px;
  }
  .eq i{
    width: 2px;
    background: var(--cream);
    opacity: 0.85;
    border-radius: 1px;
    height: 4px;
  }
  .player.is-playing .eq i{ animation: eq 0.9s ease-in-out infinite; }
  .eq i:nth-child(1){ animation-delay: 0s; }
  .eq i:nth-child(2){ animation-delay: 0.15s; }
  .eq i:nth-child(3){ animation-delay: 0.3s; }
  @keyframes eq{
    0%, 100%{ height: 4px; }
    50%{ height: 13px; }
  }
  /* the actual YouTube video is loaded here, kept off-screen -- audio still plays */
  #yt-player{
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
    pointer-events: none;
  }
  @media (max-width: 480px){
    .player{ padding: 7px 12px 7px 7px; gap: 7px; }
    .play-btn{ width: 36px; height: 36px; }
    .nav-btn{ width: 24px; height: 24px; }
    .seek-wrap{ padding: 6px 12px; }
    .player-label{ max-width: 24vw; }
  }
  /* top-center clock, 12-hour format */
  .top-center-clock{
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    z-index: 5;
    color: var(--cream);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.03em;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    pointer-events: none;
  }
  /* top-left widget: live listener count only */
  .top-left-widget{
    position: absolute;
    top: 16px;
    left: 16px;
    z-index: 5;
    color: var(--cream);
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
    background: rgba(24, 7, 5, 0.55);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 10px 16px;
    line-height: 1.3;
    pointer-events: none;
  }
  .top-left-widget .live{
    font-size: 11px;
    letter-spacing: 0.04em;
    opacity: 0.85;
    display: flex;
    align-items: center;
    gap: 6px;
    white-space: nowrap;
  }
  .top-left-widget .dot{
    width: 7px;
    height: 7px;
    flex: 0 0 auto;
    border-radius: 50%;
    background: #2ecc71;
    box-shadow: 0 0 6px #2ecc71;
    animation: tlw-pulse 1.4s infinite;
  }
  @keyframes tlw-pulse{
    0%, 100%{ opacity: 1; }
    50%{ opacity: 0.4; }
  }
  @media (max-width: 480px){
    .top-center-clock{ font-size: 17px; top: 12px; }
    .top-left-widget{ top: 10px; left: 10px; padding: 8px 12px; }
    .top-left-widget .live{ font-size: 10px; }
  }

  /* shown only inside Instagram/Facebook/TikTok/etc's in-app browser,
     since those WebViews block audio the real Chrome/Safari allow */
  #inAppBanner{
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    background: #180705;
    color: var(--cream);
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.4;
    display: flex;
    align-items: center;
    gap: 10px;
    border-bottom: 1px solid var(--line);
    box-shadow: 0 4px 14px rgba(0,0,0,0.4);
    font-family: 'Poppins', 'Helvetica Neue', Arial, sans-serif;
  }
  #inAppBanner .iab-text{ flex: 1 1 auto; }
  #inAppBanner .iab-open-btn{
    flex: 0 0 auto;
    background: var(--cream);
    color: var(--black);
    border: none;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 11px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  #inAppBanner .iab-close{
    background: none;
    border: none;
    color: var(--cream);
    opacity: 0.7;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    flex: 0 0 auto;
    padding: 0 2px;
  }

  /* small contact tag, bottom-right corner */
  .contact-tag{
    position: absolute;
    bottom: 14px;
    right: 14px;
    z-index: 5;
    display: flex;
    flex-direction: column;
    gap: 4px;
    background: rgba(24, 7, 5, 0.5);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 7px 10px;
  }
  .contact-tag a{
    display: flex;
    align-items: center;
    gap: 6px;
    color: var(--cream);
    opacity: 0.75;
    text-decoration: none;
    font-size: 10px;
    letter-spacing: 0.02em;
    white-space: nowrap;
    transition: opacity 0.15s ease;
  }
  .contact-tag a:hover{ opacity: 1; }
  .contact-tag svg{ width: 12px; height: 12px; flex: 0 0 auto; }
  @media (max-width: 480px){
    .contact-tag{ bottom: 10px; right: 10px; padding: 6px 9px; }
    .contact-tag a{ font-size: 9px; }
  }
</style>
</head>
<body>
<div class="hero">
  <div class="top-center-clock" id="liveClock">--:-- --</div>
  <div class="top-left-widget" id="topLeftWidget">
    <div class="live"><span class="dot"></span><span id="topListenerCount">-- people on 9XM</span></div>
  </div>

  <div class="contact-tag" id="contactTag">
    <a href="https://www.instagram.com/mayurr_ingole/" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>
      <span>mayurr_ingole</span>
    </a>
    <a href="mailto:myringole@gmail.com" aria-label="Email">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>
      <span>myringole@gmail.com</span>
    </a>
  </div>

  <div class="player-dock" id="playerDock">
    <div class="queue-panel" id="queuePanel" hidden>
      <div class="queue-title">All songs</div>
      <ul class="queue-list" id="queueList"></ul>
    </div>

    <div class="seek-wrap" id="seekWrap">
      <span class="time" id="curTime">0:00</span>
      <input type="range" class="seek-bar" id="seekBar" min="0" max="1000" value="0" step="1" aria-label="Seek">
      <span class="time" id="durTime">0:00</span>
    </div>

    <div class="player" id="player">
      <button class="nav-btn" id="prevBtn" aria-label="Previous track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zM9.5 12l8.5 6V6z"/></svg>
      </button>
      <button class="play-btn" id="playBtn" aria-label="Play 9XM Wali Subah radio">
        <svg class="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="icon-pause" viewBox="0 0 24 24" fill="currentColor"><path d="M6 5h4v14H6zM14 5h4v14h-4z"/></svg>
      </button>
      <button class="nav-btn" id="nextBtn" aria-label="Next track">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 6h2v12h-2zM6 6l8.5 6L6 18z"/></svg>
      </button>
      <button class="nav-btn" id="queueBtn" aria-label="Show all songs" aria-expanded="false">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 6h15v2H4V6zm0 5h9v2H4v-2zm0 5h15v2H4v-2z"/></svg>
      </button>
      <div class="player-label">
        <span class="title" id="titleText">9XM Wali Subah</span>
        <span class="status" id="statusText">Tap to play</span>
        <span class="listeners" id="listenerCount"></span>
      </div>
      <div class="eq" aria-hidden="true"><i></i><i></i><i></i></div>
    </div>
  </div>

  <div id="yt-player"></div>
</div>
<script>
  var PLAYLIST_ID = 'PLOSIsERzJzxTDf20Gz-O9rj41SUXEg1pq';
  var ytPlayer, ready = false, playing = false, pendingClick = false, hasUnlocked = false;
  var playerEl = document.getElementById('player');
  var playerDock = document.getElementById('playerDock');
  var playBtn = document.getElementById('playBtn');
  var prevBtn = document.getElementById('prevBtn');
  var nextBtn = document.getElementById('nextBtn');
  var queueBtn = document.getElementById('queueBtn');
  var queuePanel = document.getElementById('queuePanel');
  var queueList = document.getElementById('queueList');
  var statusText = document.getElementById('statusText');
  var titleText = document.getElementById('titleText');

  var seekBar = document.getElementById('seekBar');
  var curTimeEl = document.getElementById('curTime');
  var durTimeEl = document.getElementById('durTime');
  var SEEK_RESOLUTION = 1000;
  var isScrubbing = false;
  var queueOpen = false;

  function setStatus(text){ statusText.textContent = text; }
  function setPlayingState(state){
    playing = state;
    playerEl.classList.toggle('is-playing', state);
    setStatus(state ? 'Now playing' : 'Paused');
  }
  function updateSongTitle(){
    try{
      var data = ytPlayer.getVideoData();
      if (data && data.title){ titleText.textContent = data.title; }
    } catch(e){}
  }
  function unlockAudio(){
    // called from directly inside a real tap/click -- this is what mobile browsers
    // require before they'll let audio become audible. the track is already
    // playing muted (started in onReady), so this just switches it audible.
    if (hasUnlocked) return;
    hasUnlocked = true;
    try{
      ytPlayer.unMute();
      ytPlayer.setVolume(100);
      ytPlayer.playVideo();
    } catch(e){}
    setPlayingState(true);
  }

  function formatTime(sec){
    if (!isFinite(sec) || sec < 0) sec = 0;
    var m = Math.floor(sec / 60);
    var s = Math.floor(sec % 60);
    return m + ':' + (s < 10 ? '0' + s : s);
  }

  function paintSeek(pct){
    if (pct < 0) pct = 0;
    if (pct > 100) pct = 100;
    seekBar.style.background = 'linear-gradient(to right, #eeddc0 0%, #eeddc0 ' + pct + '%, rgba(238,221,192,0.25) ' + pct + '%, rgba(238,221,192,0.25) 100%)';
  }

  function pollProgress(){
    if (!ready || isScrubbing || !ytPlayer) return;
    try{
      var dur = ytPlayer.getDuration();
      var cur = ytPlayer.getCurrentTime();
      if (dur > 0){
        var pct = (cur / dur) * 100;
        seekBar.value = Math.round((cur / dur) * SEEK_RESOLUTION);
        paintSeek(pct);
        curTimeEl.textContent = formatTime(cur);
        durTimeEl.textContent = formatTime(dur);
      }
    } catch(e){}
  }

  seekBar.addEventListener('input', function(){
    isScrubbing = true;
    var pct = (seekBar.value / SEEK_RESOLUTION) * 100;
    paintSeek(pct);
    try{
      if (ready && ytPlayer){
        var dur = ytPlayer.getDuration();
        if (dur > 0){ curTimeEl.textContent = formatTime((seekBar.value / SEEK_RESOLUTION) * dur); }
      }
    } catch(e){}
  });

  function commitSeek(){
    if (ready && ytPlayer){
      try{
        var dur = ytPlayer.getDuration();
        if (dur > 0){
          var target = (seekBar.value / SEEK_RESOLUTION) * dur;
          ytPlayer.seekTo(target, true);
        }
      } catch(e){}
    }
    isScrubbing = false;
  }
  seekBar.addEventListener('change', commitSeek);
  seekBar.addEventListener('mouseup', commitSeek);
  seekBar.addEventListener('touchend', commitSeek);

  // -- "up next" queue --------------------------------------------------
  function fetchTitle(videoId, el){
    fetch('https://www.youtube.com/oembed?url=' + encodeURIComponent('https://www.youtube.com/watch?v=' + videoId) + '&format=json')
      .then(function(res){ if (!res.ok) throw new Error('oembed failed'); return res.json(); })
      .then(function(data){ if (data && data.title) el.textContent = data.title; })
      .catch(function(){ /* leave the "Track N" fallback already in place */ });
  }

  function closeQueue(){
    queueOpen = false;
    queuePanel.hidden = true;
    queueBtn.classList.remove('is-open');
    queueBtn.setAttribute('aria-expanded', 'false');
  }

  function buildQueue(){
    try{
      var ids = ytPlayer.getPlaylist();
      var idx = ytPlayer.getPlaylistIndex();
      if (!ids || !ids.length || idx < 0){
        queueList.innerHTML = '<li class="qempty">Queue not available yet.</li>';
        return;
      }
      var upcoming = [];
      for (var i = 1; i < ids.length; i++){
        upcoming.push({ videoId: ids[(idx + i) % ids.length], targetIndex: (idx + i) % ids.length });
      }
      if (!upcoming.length){
        queueList.innerHTML = '<li class="qempty">No other tracks in the playlist.</li>';
        return;
      }
      queueList.innerHTML = '';
      upcoming.forEach(function(item, i){
        var li = document.createElement('li');
        var num = document.createElement('span');
        num.className = 'qnum';
        num.textContent = (i + 1);
        var titleSpan = document.createElement('span');
        titleSpan.className = 'qtitle';
        titleSpan.textContent = 'Track ' + (i + 1);
        li.appendChild(num);
        li.appendChild(titleSpan);
        li.addEventListener('click', function(){
          if (!hasUnlocked) unlockAudio();
          ytPlayer.playVideoAt(item.targetIndex);
          ytPlayer.playVideo();
          closeQueue();
        });
        queueList.appendChild(li);
        fetchTitle(item.videoId, titleSpan);
      });
    } catch(e){
      console.error('[9XM] queue build failed', e);
      queueList.innerHTML = '<li class="qempty">Queue not available yet.</li>';
    }
  }

  queueBtn.addEventListener('click', function(){
    if (!ready) return;
    if (queueOpen){
      closeQueue();
    } else {
      queueOpen = true;
      queuePanel.hidden = false;
      queueBtn.classList.add('is-open');
      queueBtn.setAttribute('aria-expanded', 'true');
      buildQueue();
    }
  });

  document.addEventListener('click', function(e){
    if (!queueOpen) return;
    if (!playerDock.contains(e.target)) closeQueue();
  });

  console.log('[9XM] page loaded, requesting YouTube iframe API script...');
  var tag = document.createElement('script');
  tag.src = 'https://www.youtube.com/iframe_api';
  tag.onerror = function(){ console.error('[9XM] FAILED to load https://www.youtube.com/iframe_api -- this script is being blocked (ad blocker / firewall / offline).'); };
  document.head.appendChild(tag);
  setTimeout(function(){
    if (typeof YT === 'undefined'){
      console.error('[9XM] 5s after page load, window.YT is still undefined -- the iframe_api script never ran. Check the Network tab for a blocked/failed request to youtube.com, and check for ad-blocker / privacy extensions.');
    } else if (!ready){
      console.warn('[9XM] YT loaded but the player never fired onReady yet.');
    }
  }, 5000);
  window.onYouTubeIframeAPIReady = function(){
    console.log('[9XM] YouTube iframe API loaded. Creating player with playlist', PLAYLIST_ID);
    ytPlayer = new YT.Player('yt-player', {
      height: '1',
      width: '1',
      playerVars: {
        listType: 'playlist',
        list: PLAYLIST_ID,
        autoplay: 0,
        controls: 0,
        playsinline: 1
      },
      events: {
        onReady: function(){
          console.log('[9XM] player onReady fired. ready = true.');
          ready = true;
          try{
            ytPlayer.mute();
            // shuffle mode -- so next/previous (and auto-advance) pick a random
            // track instead of walking the playlist in order
            ytPlayer.setShuffle(true);
            var ids = ytPlayer.getPlaylist();
            if (ids && ids.length){
              // jump straight to a random track instead of always starting at #1
              var randomIndex = Math.floor(Math.random() * ids.length);
              console.log('[9XM] shuffling in -- starting at random track', randomIndex, 'of', ids.length);
              ytPlayer.playVideoAt(randomIndex);
            } else {
              ytPlayer.playVideo();
            }
          } catch(e){}
          // start the stream muted right away -- muted autoplay is allowed on every
          // mobile browser, so the track is already rolling by the time someone taps play
          if (pendingClick){ pendingClick = false; console.log('[9XM] a tap was waiting -- unlocking audio now.'); unlockAudio(); }
        },
        onStateChange: function(e){
          console.log('[9XM] onStateChange, e.data =', e.data, '(-1 unstarted, 0 ended, 1 playing, 2 paused, 3 buffering, 5 cued)');
          if (hasUnlocked){
            if (e.data === YT.PlayerState.PLAYING) setPlayingState(true);
            else if (e.data === YT.PlayerState.PAUSED) setPlayingState(false);
            else if (e.data === YT.PlayerState.ENDED) setPlayingState(false);
          }
          if (e.data === YT.PlayerState.PLAYING || e.data === YT.PlayerState.BUFFERING || e.data === 5){
            updateSongTitle();
            if (queueOpen) buildQueue();
          }
        },
        onError: function(e){
          console.error('[9XM] onError, e.data =', e.data, '(2 invalid id, 5 html5 error, 100 not found/private, 101/150 embedding disabled by video owner) -- skipping to next track.');
          ytPlayer.nextVideo();
        }
      }
    });
  };
  playBtn.addEventListener('click', function(){
    console.log('[9XM] play button clicked. ready =', ready, 'playing =', playing, 'hasUnlocked =', hasUnlocked);
    if (!ready){ pendingClick = true; console.log('[9XM] not ready yet -- will unlock audio once the player fires onReady.'); return; }
    if (!hasUnlocked){ unlockAudio(); return; }
    if (playing){
      ytPlayer.pauseVideo();
    } else {
      ytPlayer.playVideo();
    }
  });
  prevBtn.addEventListener('click', function(){
    if (!ready) return;
    if (!hasUnlocked) unlockAudio();
    ytPlayer.previousVideo();
    ytPlayer.playVideo();
  });
  nextBtn.addEventListener('click', function(){
    if (!ready) return;
    if (!hasUnlocked) unlockAudio();
    ytPlayer.nextVideo();
    ytPlayer.playVideo();
  });

  (function(){
    var clockEl = document.getElementById('liveClock');
    function pad(n){ return n < 10 ? '0' + n : n; }
    function tick(){
      var now = new Date();
      var h = now.getHours();
      var m = now.getMinutes();
      var ampm = h >= 12 ? 'PM' : 'AM';
      h = h % 12;
      if (h === 0) h = 12;
      clockEl.textContent = h + ':' + pad(m) + ' ' + ampm;
    }
    tick();
    setInterval(tick, 1000);
  })();

  (function(){
    // Instagram/Facebook/TikTok/Snapchat/Line/WeChat open links in their own
    // built-in browser (a "WebView"), not the phone's real Chrome/Safari.
    // Those WebViews often block audio/autoplay far more aggressively than
    // a real browser, and no page-level fix can override that -- the only
    // reliable fix is telling the visitor to open the link in a real browser.
    var ua = navigator.userAgent || '';
    var isInApp = /Instagram|FBAN|FBAV|Line\/|MicroMessenger|Snapchat/i.test(ua);
    if (!isInApp) return;

    console.warn('[9XM] in-app browser detected, UA:', ua);

    var banner = document.createElement('div');
    banner.id = 'inAppBanner';

    var text = document.createElement('div');
    text.className = 'iab-text';
    text.innerHTML = 'Music won\'t play in this in-app browser. Tap the <strong>&#8942;</strong> or <strong>&#8226;&#8226;&#8226;</strong> menu above and choose <strong>"Open in Browser"</strong>.';
    banner.appendChild(text);

    if (/Android/i.test(ua)){
      var openBtn = document.createElement('button');
      openBtn.className = 'iab-open-btn';
      openBtn.textContent = 'Open in Chrome';
      openBtn.addEventListener('click', function(){
        var target = location.href.replace(/^https?:\/\//, '');
        window.location = 'intent://' + target + '#Intent;scheme=https;package=com.android.chrome;end';
      });
      banner.appendChild(openBtn);
    }

    var closeBtn = document.createElement('button');
    closeBtn.className = 'iab-close';
    closeBtn.setAttribute('aria-label', 'Dismiss');
    closeBtn.innerHTML = '&times;';
    closeBtn.addEventListener('click', function(){ banner.remove(); });
    banner.appendChild(closeBtn);

    document.body.appendChild(banner);
  })();

  setInterval(pollProgress, 500);
</script>
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-app.js";
  import {
    getFirestore, doc, setDoc, deleteDoc, serverTimestamp,
    collection, query, where, getDocs, Timestamp
  } from "https://www.gstatic.com/firebasejs/12.17.1/firebase-firestore.js";
  var firebaseConfig = {
    apiKey: "AIzaSyBscSBX8D07YtoLW_rG1I6WcXqqyihfYwI",
    authDomain: "xmmorning.firebaseapp.com",
    projectId: "xmmorning",
    storageBucket: "xmmorning.firebasestorage.app",
    messagingSenderId: "689020702250",
    appId: "1:689020702250:web:5b7186559cc578b27ebd53"
  };
  var app = initializeApp(firebaseConfig);
  var db = getFirestore(app);
  var CLIENT_ID = 'v-' + Math.random().toString(36).slice(2) + '-' + Date.now().toString(36);
  var HEARTBEAT_MS = 20000;   // re-announce "still here" every 20s
  var STALE_MS = 45000;       // anyone silent for 45s no longer counts as online
  var listenerEl = document.getElementById('listenerCount');
  var topListenerEl = document.getElementById('topListenerCount');
  function heartbeat(){
    setDoc(doc(db, 'presence', CLIENT_ID), { lastSeen: serverTimestamp() })
      .catch(function(e){ console.error('[9XM presence] heartbeat failed', e); });
  }
  function cleanupSelf(){
    deleteDoc(doc(db, 'presence', CLIENT_ID)).catch(function(){});
  }
  function refreshCount(){
    var cutoff = Timestamp.fromMillis(Date.now() - STALE_MS);
    var q = query(collection(db, 'presence'), where('lastSeen', '>', cutoff));
    getDocs(q).then(function(snap){
      var n = snap.size;
      var label = n + (n === 1 ? ' person on 9XM' : ' people on 9XM');
      if (listenerEl) listenerEl.textContent = label;
      if (topListenerEl) topListenerEl.textContent = label;
    }).catch(function(e){ console.error('[9XM presence] count failed', e); });
  }
  heartbeat();
  refreshCount();
  setInterval(heartbeat, HEARTBEAT_MS);
  setInterval(refreshCount, 10000);
  window.addEventListener('beforeunload', cleanupSelf);
  document.addEventListener('visibilitychange', function(){
    if (document.visibilityState === 'hidden') cleanupSelf();
  });
</script>
